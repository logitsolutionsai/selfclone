<style>
:root {
  --bg: #f4f6f9; --panel: #ffffff; --ink: #14161a; --muted: #59606b; --line: #dde2e8;
  --accent: #0065fd; --accent-ink: #ffffff; --stage: #0d0f13;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1014; --panel: #171a20; --ink: #eef1f5; --muted: #a3aab5; --line: #2a2f37; --accent: #5b9dff; --accent-ink: #0b0d10; --stage: #050608; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
}
main { max-width: 560px; margin: 0 auto; }
.stage {
  position: relative; width: 100%; max-width: 512px; aspect-ratio: 1 / 1; margin: 0 auto;
  border-radius: 16px; overflow: hidden; background: var(--stage);
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.12);
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage canvas[hidden] { display: none; }
.badge {
  position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none;
  display: block; visibility: visible; opacity: 1;
  background: #d92d20; color: #ffffff; font-weight: 700; font-size: 12px; letter-spacing: .08em;
  padding: 5px 9px; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.35);
}
.controls { margin-top: 14px; }
.controls[hidden] { display: none; }
textarea {
  width: 100%; resize: vertical; min-height: 56px; padding: 10px 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); font: inherit;
}
textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
button, .file {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 8px 14px;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button:focus-visible, .file:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.file { position: relative; overflow: hidden; display: inline-block; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.status { min-height: 1.4em; color: var(--muted); font-size: .9rem; margin: 8px 0 0; }
.info { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.info[hidden] { display: none; }
.info h2 { font-size: 1rem; margin: 0 0 8px; }
.info dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
.info dt { color: var(--muted); }
.info dd { margin: 0; overflow-wrap: anywhere; }
.info p { color: var(--muted); font-size: .88rem; margin: 10px 0 0; }
#unlock { margin-top: 10px; }
#unlock[hidden] { display: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<body>
<main>
  <div id="stage" class="stage">
    <canvas id="cavity" aria-hidden="true"></canvas>
    <canvas id="face" role="img" aria-label="AI clone avatar"></canvas>
    <canvas id="patches" aria-hidden="true" hidden></canvas>
    <div id="badge" class="badge">AI CLONE</div>

  <div id="controls" class="controls">
    <label for="text" class="vh">Text for the clone to say</label>
    <textarea id="text" rows="2" placeholder="Type something for the clone to say, then press Say it"></textarea>
    <div class="row">
      <button id="sayBtn" type="button">Say it</button>
      <button id="stopBtn" type="button" class="ghost">Stop</button>
      <label class="file ghost">Play audio file<input id="audioFile" type="file" accept="audio/*"></label>
      <label class="check"><input id="voiceOn" type="checkbox" checked> Browser voice</label>
      <button id="infoBtn" type="button" class="ghost" aria-expanded="false" aria-controls="info">About this clone</button>
    </div>
    <button id="unlock" type="button" hidden>Turn on sound</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </div>
  <section id="info" class="info" hidden aria-label="Consent record">
    <h2>About This Clone</h2>
    <dl>
      <dt>Person</dt><dd id="infoName"></dd>
      <dt>Consent</dt><dd id="infoStatement"></dd>
      <dt>Recorded</dt><dd id="infoDate"></dd>
      <dt>Method</dt><dd id="infoMethod"></dd>
      <dt>Clip</dt><dd id="infoClip"></dd>
      <dt>Glasses</dt><dd id="infoGlasses"></dd>
      <dt>Photo hash</dt><dd id="infoHash"></dd>
      <dt>Made with</dt><dd id="infoTool"></dd>
    </dl>
    <p id="infoNote">This is an AI clone, not the person and not a recording of them. It is a single photo warped in your browser.
    The page works offline, has no video export, and cannot be driven by another person's webcam.</p>
  </section>
